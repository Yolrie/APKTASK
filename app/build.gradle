// Load signing secrets from keystore.properties (git-ignored).
// Falls back to empty strings so the debug build still compiles on CI without the file.
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.example.apktask'
    compileSdk 36

    signingConfigs {
        release {
            storeFile     keystoreProps['storeFile']     ? rootProject.file(keystoreProps['storeFile']) : null
            storePassword keystoreProps['storePassword'] ?: ''
            keyAlias      keystoreProps['keyAlias']      ?: ''
            keyPassword   keystoreProps['keyPassword']   ?: ''
        }
    }

    defaultConfig {
        applicationId "io.doit.app"
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName "3.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            signingConfig    signingConfigs.release
            minifyEnabled    true
            shrinkResources  true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

